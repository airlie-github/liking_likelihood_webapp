<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liking Likelihood — Teacher Dashboard</title>
<style>
:root{
  --bg:#0e1a2b; --panel:#152540; --ink:#f4f7fa; --muted:#9bb0c7;
  --accent:#4a90e2; --good:#27ae60; --warn:#e67e22; --bad:#e94560;
  --fs-1:1rem; --fs-2:1.25rem; --fs-3:1.75rem; --fs-4:2.5rem; --fs-5:3.5rem;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:1600px;margin:0 auto;padding:1.5rem 2rem}
header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem}
h1{margin:0;font-size:var(--fs-4);font-weight:700}
.room-badge{font-size:var(--fs-3);color:var(--accent);font-weight:700;letter-spacing:0.05em}
.meta{color:var(--muted);font-size:var(--fs-2)}
.setup{background:var(--panel);padding:2rem;border-radius:1rem;max-width:36rem;margin:4rem auto;text-align:center}
.setup h2{margin:0 0 1rem 0;font-size:var(--fs-3)}
.setup input{font-size:var(--fs-3);padding:0.75rem 1rem;border-radius:0.5rem;border:1px solid #2a3f5f;background:#0a1426;color:var(--ink);width:100%;text-align:center;text-transform:uppercase;letter-spacing:0.1em}
.setup button{margin-top:1rem;font-size:var(--fs-2);padding:0.75rem 2rem;background:var(--accent);color:white;border:none;border-radius:0.5rem;cursor:pointer;font-weight:600}
.setup button:hover{background:#3a78c4}
.setup .hint{color:var(--muted);font-size:var(--fs-1);margin-top:1rem}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:0.75rem;overflow:hidden;font-size:var(--fs-2)}
thead th{background:#0a1426;padding:0.75rem 0.5rem;font-weight:600;text-align:center;color:var(--muted);font-size:var(--fs-1);letter-spacing:0.05em;text-transform:uppercase}
thead th.player{text-align:left;padding-left:1.25rem}
tbody td{padding:0.75rem 0.5rem;text-align:center;border-top:1px solid #1f3354}
tbody td.player{text-align:left;padding-left:1.25rem;font-weight:600}
tbody td.total{font-weight:700;color:var(--accent);font-size:var(--fs-2)}
tbody tr:nth-child(1) td.player::before{content:"🥇 ";font-size:0.9em}
tbody tr:nth-child(2) td.player::before{content:"🥈 ";font-size:0.9em}
tbody tr:nth-child(3) td.player::before{content:"🥉 ";font-size:0.9em}
.empty-cell{color:#3a4f6f}
.empty-state{text-align:center;color:var(--muted);padding:3rem;font-size:var(--fs-2)}
.error{background:var(--bad);color:white;padding:0.75rem 1rem;border-radius:0.5rem;margin-bottom:1rem}
.pulse{display:inline-block;width:0.5rem;height:0.5rem;background:var(--good);border-radius:50%;margin-right:0.4rem;vertical-align:middle;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}
button.small{font-size:var(--fs-1);padding:0.25rem 0.75rem;background:transparent;color:var(--muted);border:1px solid var(--muted);border-radius:0.4rem;cursor:pointer;margin-left:0.5rem}
button.small:hover{color:var(--ink);border-color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

<!-- Setup screen -->
<div id="setup" class="setup">
  <h2>Teacher Dashboard</h2>
  <input id="room-input" placeholder="Room code" autofocus>
  <br>
  <button onclick="startWatching()">View Room</button>
  <div class="hint">Make sure students enter the same room code on their phones.</div>
</div>

<!-- Live view -->
<div id="live" style="display:none">
  <header>
    <div>
      <h1>Liking Likelihood</h1>
      <div class="meta">Room <span class="room-badge" id="room-label"></span>
        <button class="small" onclick="changeRoom()">change</button></div>
    </div>
    <div class="meta" style="text-align:right">
      <div><span class="pulse"></span>Players: <b id="player-count">0</b></div>
      <div>Last update: <span id="last-update">—</span></div>
    </div>
  </header>
  <div id="error-box"></div>
  <div id="table-container"></div>
</div>

</div>

<script>
// Paste your Apps Script web-app URL here (same URL the game uses for LOG_URL).
const LOG_URL = '';

const POLL_MS = 4000;
let pollTimer = null;
let currentRoom = '';

function startWatching(){
  const room = document.getElementById('room-input').value.trim();
  if(!room){ alert('Enter a room code'); return; }
  currentRoom = room;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('live').style.display = '';
  document.getElementById('room-label').textContent = room;
  fetchAndRender();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(fetchAndRender, POLL_MS);
}

function changeRoom(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = null;
  document.getElementById('live').style.display = 'none';
  document.getElementById('setup').style.display = '';
  document.getElementById('room-input').value = currentRoom;
  document.getElementById('room-input').focus();
}

function showError(msg){
  document.getElementById('error-box').innerHTML = msg
    ? `<div class="error">${msg}</div>` : '';
}

async function fetchAndRender(){
  if(!LOG_URL){
    showError('LOG_URL is not set in dashboard.html — see setup instructions.');
    return;
  }
  try {
    const url = LOG_URL + (LOG_URL.includes('?')?'&':'?') + 'room=' + encodeURIComponent(currentRoom);
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    renderTable(data.rows || []);
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
    showError('');
  } catch (err){
    showError('Failed to fetch data: ' + err.message);
  }
}

function renderTable(rows){
  // Latest score per (player, game) — rows are appended in time order, so last wins.
  const byPlayer = {};
  rows.forEach(r => {
    const p = r.player || '(anon)';
    if(!byPlayer[p]) byPlayer[p] = {games:{}, lastTs:0};
    const g = Number(r.game);
    const s = Number(r.score);
    if(g >= 1 && g <= 10 && !isNaN(s)){
      byPlayer[p].games[g] = s;
    }
    const ts = +new Date(r.ts);
    if(ts > byPlayer[p].lastTs) byPlayer[p].lastTs = ts;
  });

  const players = Object.keys(byPlayer).map(p => {
    const total = Object.values(byPlayer[p].games).reduce((a,b)=>a+b,0);
    return {name:p, games:byPlayer[p].games, total, lastTs:byPlayer[p].lastTs};
  }).sort((a,b) => b.total - a.total || a.name.localeCompare(b.name));

  document.getElementById('player-count').textContent = players.length;

  const container = document.getElementById('table-container');
  if(players.length === 0){
    container.innerHTML = `<div class="empty-state">No players yet. Waiting for scores from room <b>${currentRoom}</b>…</div>`;
    return;
  }
  const headerCols = Array.from({length:10}, (_,i) => `<th>G${i+1}</th>`).join('');
  const rowsHtml = players.map(p => {
    const cells = Array.from({length:10}, (_,i) => {
      const v = p.games[i+1];
      return `<td${v==null?' class="empty-cell"':''}>${v==null?'–':v}</td>`;
    }).join('');
    return `<tr><td class="player">${p.name}</td>${cells}<td class="total">${p.total}</td></tr>`;
  }).join('');
  container.innerHTML = `<table>
    <thead><tr><th class="player">Player</th>${headerCols}<th>Total</th></tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>`;
}

// Allow Enter key to submit room code
document.getElementById('room-input').addEventListener('keydown', e => {
  if(e.key === 'Enter') startWatching();
});
</script>
</body>
</html>
