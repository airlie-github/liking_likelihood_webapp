<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liking Likelihood</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a90e2">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Likelihood">
<meta name="mobile-web-app-capable" content="yes">
<style>

:root{
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --sz-0:0.25rem; --sz-1:0.5rem; --sz-2:0.875rem; --sz-3:1.125rem; --sz-4:1.5rem; --sz-5:2.25rem;
  --r-sm:0.5rem; --r-lg:1rem;
  --border-1:0.0625rem; --border-2:0.125rem;
  --fw-normal:400; --fw-bold:700;
  --tap:2.75rem;
  /* colours — default palette. First four are the dice colours (d4, d6, d8, d10). Remaining colours appended for non-dice uses. */
  --c-die-1:#e74c3c; --c-die-2:#3498db; --c-die-3:#27ae60; --c-die-4:#9b59b6;
  --c-primary:#e94560; --c-primary-dark:#d63851;
  --c-blue:#3498db; --c-purple:#9b59b6;
  --c-gold:#d4a017; --c-amber:#f39c12; --c-orange:#e67e22; --c-teal:#1abc9c;
  --c-success:#27ae60; --c-success-bg:#d4edda; --c-success-fg:#155724;
  --c-danger:#e74c3c; --c-danger-bg:#f8d7da; --c-danger-fg:#721c24;
  --c-bg:#f5f5f5; --c-surface:#fff; --c-text:#222; --c-text-muted:#444;
  --c-border:#eee; --c-border-strong:#ccc; --c-overlay-dark:#333;
  --c-title-1:#1a1a2e; --c-title-2:#16213e; --c-title-3:#0f3460;
}

/* ===== RESET & BASE ===== */
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{height:100%;min-height:100vh;min-height:100dvh;font-family:var(--font-sans);background:var(--c-bg);color:var(--c-text);overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;border-radius:var(--r-lg);font-size:var(--sz-3);padding:var(--sz-2) var(--sz-3);font-weight:var(--fw-bold);transition:all .15s;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}

/* ===== LAYOUT ===== */
.page{display:none;min-height:100vh;max-width:30rem;margin:0 auto;padding:var(--sz-2);position:relative}
.page.active{display:flex;flex-direction:column}
.game-screen{display:none;min-height:100vh;min-height:100dvh;max-width:30rem;margin:0 auto;padding:0;flex-direction:column}
.game-screen.active{display:flex}
.game-screen.active .game-layout{min-height:calc(100vh - 3.125rem);min-height:calc(100dvh - 3.125rem)}

/* ===== TITLE PAGE ===== */
#title-page{align-items:center;justify-content:center;text-align:center;gap:var(--sz-4);background:linear-gradient(135deg,var(--c-title-1) 0%,var(--c-title-2) 50%,var(--c-title-3) 100%);color:var(--c-surface)}
#title-page h1{font-size:var(--sz-5);font-weight:var(--fw-bold);letter-spacing:calc(var(--sz-0) * -1)}
#title-page h2{font-size:var(--sz-3);font-weight:var(--fw-normal);opacity:.8}
.room-input{width:100%;padding:var(--sz-2);border-radius:var(--r-lg);border:var(--border-1) solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:var(--c-surface);font-size:var(--sz-3);text-align:center;text-transform:uppercase;letter-spacing:var(--sz-0)}
.room-input::placeholder{color:rgba(255,255,255,.4);text-transform:none;letter-spacing:0}
#start-btn{width:100%;padding:var(--sz-3);background:var(--c-primary);color:var(--c-surface);font-size:var(--sz-3);font-weight:var(--fw-bold);border-radius:var(--r-lg);margin-top:var(--sz-1)}
#start-btn:hover{background:var(--c-primary-dark)}
.dice-icons-title{font-size:var(--sz-5);letter-spacing:var(--sz-1);margin:var(--sz-1) 0}

/* ===== GAME LIST PAGE ===== */
#game-list{gap:var(--sz-1);padding-bottom:var(--sz-4)}
.game-list-header{display:flex;align-items:center;gap:var(--sz-2)}
.game-list-header h2{font-size:var(--sz-4);font-weight:var(--fw-bold)}
.back-home{background:none;color:var(--c-text);font-size:var(--sz-4);padding:var(--sz-1);width:var(--sz-5);height:var(--sz-5);display:flex;align-items:center;justify-content:center;border-radius:50%}
.game-card{background:var(--c-surface);border-radius:var(--r-lg);padding:var(--sz-1) var(--sz-2);display:flex;align-items:center;gap:var(--sz-2);box-shadow:0 var(--sz-0) var(--sz-1) rgba(0,0,0,.06);cursor:pointer;transition:all .15s;border:var(--border-1) solid transparent}
.game-card:active{transform:scale(.98);border-color:var(--c-primary)}
.game-card .num{width:var(--sz-5);height:var(--sz-5);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-weight:var(--fw-bold);font-size:var(--sz-3);color:var(--c-surface);flex-shrink:0}
.game-card .info{flex:1;min-width:0}
.game-card .info h3{font-size:var(--sz-2);font-weight:var(--fw-bold);margin-bottom:var(--sz-0)}
.game-card .info p{font-size:var(--sz-2);color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-card .score-badge{background:var(--c-border);border-radius:var(--r-sm);padding:var(--sz-1) var(--sz-2);font-size:var(--sz-2);font-weight:var(--fw-bold);color:var(--c-text);flex-shrink:0}
.game-card .score-badge.done{background:var(--c-success-bg);color:var(--c-success-fg)}

/* ===== GAME SCREEN COMMON ===== */
.game-header{display:flex;align-items:center;padding:var(--sz-1) var(--sz-2);background:var(--c-surface);border-bottom:var(--border-1) solid var(--c-border);flex-shrink:0}
.game-header .back-btn{background:none;font-size:var(--sz-4);padding:var(--sz-0) var(--sz-1);color:var(--c-text)}
.game-header .title{flex:1;font-size:var(--sz-2);font-weight:var(--fw-bold);margin-left:var(--sz-1)}
.game-layout{flex:1;display:flex;flex-direction:column}
.game-zone-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5rem var(--sz-2) var(--sz-1);gap:var(--sz-0);overflow:hidden;min-height:0;position:relative}
.game-zone-text{flex:0 0 7rem;text-align:center;padding:var(--sz-0) var(--sz-2);font-size:var(--sz-4);color:var(--c-text);display:flex;align-items:flex-end;justify-content:center;width:100%;overflow:visible}
.game-zone-buttons{flex:0 0 3.75rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--sz-0) var(--sz-2)}
.game-zone-next{flex:0 0 3.25rem;width:100%;display:flex;align-items:center}
.game-zone-next .next-btn{width:auto}
.game-zone-next .next-btn:disabled{opacity:.35;pointer-events:none}
.game-zone-table{flex:0 0 10rem;background:var(--c-surface);border-top:var(--border-1) solid var(--c-border);padding:var(--sz-1) var(--sz-2) var(--sz-1);overflow-y:auto}
.stats-table{width:100%;border-collapse:collapse;font-size:var(--sz-2)}
.stats-table th{padding:var(--sz-0) var(--sz-0);color:var(--c-text);font-weight:var(--fw-bold);text-align:center;white-space:nowrap;position:sticky;left:0;background:var(--c-surface);z-index:1;text-align:right;min-width:2.75rem}
.stats-table td{padding:var(--sz-0) var(--sz-1);text-align:center;border-left:var(--border-1) solid var(--c-border);min-width:var(--sz-5);width:var(--sz-5)}
.stats-table .correct{color:var(--c-success);font-weight:var(--fw-bold)}
.stats-table .incorrect{color:var(--c-danger);font-weight:var(--fw-bold)}
.stats-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.score-line{display:flex;justify-content:space-between;align-items:center;margin-top:var(--sz-1);font-weight:var(--fw-bold);font-size:var(--sz-2)}
.result-line{min-height:1.75rem;display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--sz-3);margin-top:var(--sz-1);padding:var(--sz-0) var(--sz-1)}
.next-btn{background:var(--c-primary);color:var(--c-surface);padding:var(--sz-2) var(--sz-4);font-size:var(--sz-2);margin-top:var(--sz-2)}
.result-indicator{display:none;align-items:center;justify-content:center;min-width:var(--sz-4);height:var(--sz-4);padding:0 var(--sz-1);border-radius:var(--r-sm);font-weight:var(--fw-bold);color:var(--c-surface);font-size:var(--sz-2)}
.result-indicator.correct{display:inline-flex;background:var(--c-success)}
.result-indicator.wrong{display:inline-flex;background:var(--c-danger)}

/* ===== INSTRUCTIONS POPUP ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:var(--sz-3)}
.modal-card{background:var(--c-surface);color:var(--c-text);max-width:32rem;width:100%;max-height:80vh;overflow-y:auto;border-radius:var(--r-lg);padding:var(--sz-4) var(--sz-3) var(--sz-3);position:relative;box-shadow:0 var(--sz-2) var(--sz-3) rgba(0,0,0,.3);line-height:1.5}
.modal-close{position:absolute;top:var(--sz-1);right:var(--sz-1);background:transparent;border:none;font-size:var(--sz-4);line-height:1;cursor:pointer;color:var(--c-text);padding:var(--sz-0) var(--sz-1)}

/* ===== REEL SPINNER ===== */
.reel-strip{transition:transform 2s cubic-bezier(.15,.85,.35,1);will-change:transform}
.reel-strip.spinning{filter:blur(var(--sz-0))}
.reel-num{height:5rem;display:flex;align-items:center;justify-content:center;font-size:2.625rem;font-weight:var(--fw-bold);color:var(--c-overlay-dark)}

/* ===== TUTORIAL TOGGLE ===== */
.tut-toggle{display:flex;align-items:center;gap:var(--sz-1);font-size:var(--sz-2);font-weight:var(--fw-bold);color:var(--c-text)}
.tut-switch{position:relative;width:var(--sz-5);height:var(--sz-3);background:var(--c-border-strong);border-radius:var(--r-sm);cursor:pointer;transition:background .2s;flex-shrink:0}
.tut-switch.on{background:var(--c-success)}
.tut-switch::after{content:'';position:absolute;top:50%;left:var(--sz-0);width:var(--sz-2);height:var(--sz-2);background:var(--c-surface);border-radius:50%;transition:left .2s;transform:translateY(-50%)}
.tut-switch.on::after{left:var(--sz-3)}
.hcap-toggle{display:none;align-items:center;gap:var(--sz-1);font-size:var(--sz-2);font-weight:var(--fw-bold);color:var(--c-text);margin-right:var(--sz-2)}
.hcap-toggle.visible{display:flex}
.hcap-toggle.disabled{opacity:.45;pointer-events:none}
.hcap-switch{position:relative;width:var(--sz-5);height:var(--sz-3);background:var(--c-border-strong);border-radius:var(--r-sm);cursor:pointer;transition:background .2s;flex-shrink:0}
.hcap-switch.on{background:var(--c-gold)}
.hcap-switch::after{content:'';position:absolute;top:50%;left:var(--sz-0);width:var(--sz-2);height:var(--sz-2);background:var(--c-surface);border-radius:50%;transition:left .2s;transform:translateY(-50%)}
.hcap-switch.on::after{left:var(--sz-3)}

/* ===== GUESS BUTTONS ===== */
.guess-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:var(--sz-1);width:100%;max-width:20rem}
.guess-btn{font-size:var(--sz-4);font-weight:var(--fw-bold);border-radius:var(--r-lg);color:var(--c-surface);height:3.5rem;width:3.5rem;margin:0 auto;display:flex;align-items:center;justify-content:center}
.guess-btn[data-die="4"]{background:var(--c-die-1);clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);border-radius:0}
.guess-btn[data-die="6"]{background:var(--c-die-2);clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);border-radius:0}
.guess-btn[data-die="8"]{background:var(--c-die-3);clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);border-radius:0}
.guess-btn[data-die="10"]{background:var(--c-die-4);clip-path:polygon(50% 0%,79% 10%,100% 38%,97% 69%,79% 95%,50% 100%,21% 95%,3% 69%,0% 38%,21% 10%);border-radius:0}
.guess-btn:disabled{opacity:.4;transform:none!important}
.guess-btn:hover:not(:disabled):not(.selected){transform:scale(1.15);filter:brightness(1.3)}
.guess-btn.selected{transform:scale(1.15);filter:brightness(1.4)}

/* ===== CONFIDENCE BUTTONS ===== */
.confidence-row{display:flex;gap:var(--sz-1);width:100%;max-width:18.75rem}
.conf-btn{flex:1;padding:var(--sz-2);font-size:var(--sz-2);font-weight:var(--fw-bold);border-radius:var(--r-lg);color:var(--c-surface)}
.conf-btn[data-conf="low"]{background:var(--c-amber)}
.conf-btn[data-conf="medium"]{background:var(--c-orange)}
.conf-btn[data-conf="high"]{background:var(--c-danger)}
.conf-btn:disabled{opacity:.4}
.conf-btn.selected{box-shadow:0 0 0 var(--sz-0) gold}

/* ===== GAME 3 LAYOUT ===== */
.g3-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:var(--sz-1);width:100%;max-width:20rem;margin:0 auto}
.g3-conf-wrap{grid-column:3/5;display:flex;flex-direction:column;gap:var(--sz-0);justify-content:center}
.g3-conf-label{font-size:var(--sz-2);font-weight:var(--fw-bold);color:var(--c-text);text-align:center}
.g3-conf-btn{padding:var(--sz-0) var(--sz-1);font-size:var(--sz-2);font-weight:var(--fw-bold);border-radius:var(--r-sm);color:var(--c-surface);text-align:center;
  width:100%;transition:all .15s}
.g3-conf-btn[data-conf="low"]{background:var(--c-amber)}
.g3-conf-btn[data-conf="medium-high"]{background:var(--c-orange)}
.g3-conf-btn[data-conf="certain"]{background:var(--c-danger)}
.g3-conf-btn.selected{box-shadow:0 0 0 var(--sz-0) gold;transform:scale(1.05)}

/* ===== GAME 5 BIAS DETECTIVE — borrows Game 9's bias-preset/bars/tokens visual ===== */
.g5-rollers-row{display:flex;gap:0.125rem;align-items:center;flex:1;justify-content:flex-end;flex-wrap:nowrap}
.g5-roller{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--c-border);color:var(--c-text);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:var(--fw-bold);flex-shrink:0;transition:opacity .2s,transform .2s,background .2s,color .2s;line-height:1}
.g5-roller.filled{background:var(--c-gold);color:var(--c-surface)}
.g5-roller.just-filled{transform:scale(1.25)}
.g5-roller.half-seen{opacity:.4}

/* ===== HORSE RACE (game 8) ===== */
.g8-wrap{display:flex;flex-direction:column;gap:var(--sz-1)}
.g8-controls{display:flex;align-items:center;gap:var(--sz-1);justify-content:center;flex-wrap:wrap}
.g8-dice-row{display:flex;align-items:center;gap:var(--sz-1);min-height:3.5rem;font-size:var(--sz-4);font-weight:var(--fw-bold)}
.g8-hand{font-size:var(--sz-4);line-height:1;flex-shrink:0;display:inline-block;transform:rotate(90deg)}
.g8-die{width:1.5rem;height:1.5rem;color:var(--c-surface);font-size:var(--sz-2);font-weight:var(--fw-bold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.g8-die.d4{background:var(--c-die-1);clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%)}
.g8-die.d6{background:var(--c-die-2);clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)}
.g8-die.d8{background:var(--c-die-3);clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%)}
.g8-die.d10{background:var(--c-die-4);clip-path:polygon(50% 0%,79% 10%,100% 38%,97% 69%,79% 95%,50% 100%,21% 95%,3% 69%,0% 38%,21% 10%)}
.g8-rhs{margin-left:auto;display:flex;align-items:center;gap:var(--sz-1);flex-shrink:0}
.g8-roller{width:2.625rem;height:2.625rem;border-radius:50%;background:var(--c-gold);color:var(--c-surface);display:flex;align-items:center;justify-content:center;font-size:var(--sz-3);font-weight:var(--fw-bold);overflow:hidden;position:relative;flex-shrink:0}
.g8-roller .qm-text{position:relative;z-index:1}
.g8-roller .qm-reel{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;border-radius:50%;display:flex;justify-content:center}
.g8-roller .qm-reel .reel-strip{width:100%;will-change:transform}
.g8-roller .qm-reel .reel-num{width:100%;display:flex;align-items:center;justify-content:center;font-weight:var(--fw-bold);color:var(--c-surface)}
.g8-eq{font-size:var(--sz-4);font-weight:var(--fw-bold);color:var(--c-text)}
.g8-track{display:flex;flex-direction:column;gap:0}
.g8-lane{display:flex;align-items:center;gap:var(--sz-0);padding:0 var(--sz-0);border-radius:var(--r-sm);transition:background .2s}
.g8-label{font-size:var(--sz-3);font-weight:var(--fw-bold);width:2rem;text-align:left;flex-shrink:0;color:var(--c-text)}
.g8-flag{font-size:var(--sz-4);line-height:1;cursor:pointer;flex-shrink:0;opacity:0.3;filter:grayscale(1);transition:opacity .15s,filter .15s,transform .15s;user-select:none}
.g8-flag:hover{opacity:0.6}
.g8-flag.selected{opacity:1;filter:none;transform:scale(1.2)}
.g9-tokens-row{display:flex;justify-content:center;align-items:center;gap:0;margin:var(--sz-0) auto var(--sz-0);font-size:var(--sz-3);line-height:1}
.g9-tokens-row span{margin-left:-0.125rem}
.g9-tokens-row span:first-child{margin-left:0}
.g9-lane-tokens{display:inline-flex;flex-shrink:0;align-items:center;justify-content:flex-end;height:var(--sz-4);min-width:1.5rem}
.g9-lane-tokens svg{display:block;flex-shrink:0}
.g9-bet-cell{display:flex;align-items:center;gap:var(--sz-0);flex-shrink:0;width:3.5rem;justify-content:flex-end;padding-right:var(--sz-1)}
.g9-bet-cell .g8-flag{font-size:var(--sz-4)}
.g9-bet-cell .g8-flag.selected{opacity:1;filter:none;transform:none}
.g9-bet-headers{display:flex;align-items:center;gap:var(--sz-0);padding:0 var(--sz-0);font-size:var(--sz-2);font-weight:var(--fw-bold);color:var(--c-text);margin-top:var(--sz-0)}
.g9-bet-header-cell{justify-content:center}
.g9-house-flag{cursor:default;pointer-events:none;min-width:var(--sz-4)}
.g10-combo-bar{display:inline-flex;align-items:center;justify-content:center;gap:var(--sz-0);min-width:8rem;height:2rem;background:var(--c-gold);border-radius:var(--r-md);padding:0 var(--sz-1);border:0.0625rem solid #a87a0d;flex-shrink:0;transition:background .15s}
.g10-arrow{padding:0 var(--sz-1);font-size:var(--sz-4);background:none;border:none;cursor:pointer;color:var(--c-text);min-width:0;min-height:0;line-height:1}
.g10-arrow:hover{color:var(--c-blue)}
.g10-arrow:disabled{opacity:.35;cursor:default}
.g8-bar-zone{flex:1;display:flex;align-items:center;height:var(--sz-4)}
.g8-observer{flex:0 0 var(--sz-4);width:var(--sz-4);height:var(--sz-4);font-size:var(--sz-4);line-height:1;display:flex;align-items:center;justify-content:center;opacity:.55;margin-left:var(--sz-1)}
.g8-bar{position:relative;height:100%;background:var(--c-border);border-radius:var(--r-sm);overflow:visible}
.g8-steps{display:flex;height:100%;width:100%}
.g8-step{flex:1;background:rgba(0,0,0,0.04);border-right:var(--border-1) solid rgba(0,0,0,.18)}
.g8-step:last-child{border-right:none;background:linear-gradient(90deg,rgba(0,0,0,0.04),var(--c-success-bg))}
.g8-token{position:absolute;top:calc(var(--sz-4) * -0.25);left:calc(var(--sz-4) * -0.5);width:var(--sz-4);height:var(--sz-4);display:flex;align-items:center;justify-content:center;font-size:var(--sz-4);line-height:1;transition:left .35s ease-out;z-index:1;transform:scaleX(-1)}

/* ===== BOX ANIMATION ===== */
.box-scene{position:relative;width:12.5rem;height:11.25rem;margin:0 auto}
.box-body{position:absolute;bottom:0;left:1.875rem;width:8.75rem;height:5.625rem;background:linear-gradient(145deg,#d4a574,#c4956a);border-radius:var(--r-sm) var(--r-sm) var(--r-sm) var(--r-sm);border:var(--border-1) solid #a0764a;overflow:hidden}
.box-body::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,.15) 50%,transparent 70%)}

<script>
// ===== TELEMETRY =====
// Set this to your Apps Script web-app URL to enable score logging.
// Leave as empty string to disable (game still plays normally).
const LOG_URL = '';

const NICK_ADJ  = ['Pink','Bold','Calm','Wise','Lucky','Brave','Jolly','Silver','Golden','Tiny','Mighty','Swift','Curious','Quiet','Sunny','Witty','Eager','Snowy','Mellow','Plucky'];
const NICK_NOUN = ['Otter','Owl','Fox','Wombat','Heron','Lynx','Badger','Magpie','Newt','Octopus','Falcon','Beaver','Robin','Marten','Toad','Stoat','Crane','Hare','Lemur','Quokka'];
function generateNickname(){
  const a = NICK_ADJ[Math.floor(Math.random()*NICK_ADJ.length)];
  const n = NICK_NOUN[Math.floor(Math.random()*NICK_NOUN.length)];
  const num = Math.floor(Math.random()*90)+10;
  return a + n + num;
}
function getOrCreateNickname(){
  let nick = localStorage.getItem('ll_nickname');
  if(!nick){ nick = generateNickname(); localStorage.setItem('ll_nickname', nick); }
  return nick;
}
function logEvent(payload){
  if(!LOG_URL || !S.roomCode) return;
  try {
    fetch(LOG_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({
        ts: Date.now(),
        room: S.roomCode,
        player: S.playerNickname
      }, payload))
    });
  } catch(e){}
}

// ===== STATE =====
const S = {
  mode: 'random', // per-game, toggled by slider
  gameTutorial: {1:false,2:false,3:false,4:false,5:false,6:false,7:false,8:false,9:false,10:false},
  roomCode: '',
  playerNickname: '',
  currentGame: null,
  rounds: [],
  currentRound: 0,
  scores: Array(10).fill(0),
  houseScores: Array(10).fill(0), // Game 9: per-game cumulative House score (only game 9 uses this)
  completed: Array(10).fill(false), // tutorial-completion flag per game (1..10)
  phase: 'guess',
  game3ConfPick: null,
  g5: null, // bias-detective token game state
  g8: null, // horse race state: {bet, trackLen, positions, rolls, winner, animating}
  g8Handicap: false, // when true, animals start with a head-start that equalises win probability
  g9Handicap: false, // same idea for the CLT biased horse-race
  g10: null, // reverse-the-race state: {tray, slot, bias, submitted}
};


// ===== PALETTE PICKER =====
function setPalette(name){
  localStorage.setItem('palette',name);
  document.body.classList.remove('pal-default','pal-cb');
  document.body.classList.add('pal-'+name);
  document.querySelectorAll('.pal-card').forEach(function(c){
    var sel=c.dataset.pal===name;
    c.classList.toggle('selected',sel);
    c.setAttribute('aria-pressed',sel?'true':'false');
  });
}
function initPaletteUI(){
  var p=localStorage.getItem('palette')||'default';
  document.querySelectorAll('.pal-card').forEach(function(c){
    var sel=c.dataset.pal===p;
    c.classList.toggle('selected',sel);
    c.setAttribute('aria-pressed',sel?'true':'false');
  });
}

// ===== DICE ROLL SPEED =====
// Multiplier applied to spin durations: 1 = slow (default), 0.5 = fast.
var _diceSpeed='slow';
function diceSpeedFactor(){
  return _diceSpeed==='fast' ? 0.5 : 1;
}
function setDiceSpeed(name){
  _diceSpeed=name;
  document.querySelectorAll('.speed-card').forEach(function(c){
    var sel=c.dataset.speed===name;
    c.classList.toggle('selected',sel);
    c.setAttribute('aria-pressed',sel?'true':'false');
  });
}
function initDiceSpeedUI(){
  // Speed always defaults to 'slow' on page load (not persisted).
  try{ localStorage.removeItem('diceSpeed'); }catch(e){}
  _diceSpeed='slow';
  document.querySelectorAll('.speed-card').forEach(function(c){
    var sel=c.dataset.speed==='slow';
    c.classList.toggle('selected',sel);
    c.setAttribute('aria-pressed',sel?'true':'false');
  });
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',function(){initPaletteUI();initDiceSpeedUI();});
}else{
  initPaletteUI();
  initDiceSpeedUI();
}

// ===== SHARED HELPERS =====
function roundHeaderCells(n){
  return Array.from({length:n},function(_,i){return '<td class="hdr-cell">'+(i+1)+'</td>';}).join('');
}
function prefersReducedMotion(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

// ===== GAME DEFINITIONS =====
const GAMES = [
  {id:1, title:'Probability', topic:'Section 2', desc:'Guess the dice', color:'var(--c-primary)'},
  {id:2, title:'Likelihood', topic:'Section 3', desc:'Guess the dice with data', color:'var(--c-blue)'},
  {id:3, title:'Likelihood Ratio', topic:'Section 4', desc:'How confident are you?', color:'var(--c-orange)'},
  {id:4, title:'Independence', topic:'Section 5', desc:'Guess the dice with more data', color:'var(--c-success)'},
  {id:5, title:'Log-Likelihood', topic:'Section 6', desc:'House vs Player — spot the bias!', color:'var(--c-purple)'},
  {id:6, title:"Bayes' Theorem", topic:'Section 8', desc:'Guess the dice again', color:'var(--c-danger)'},
  {id:7, title:'Marginalization', topic:'Section 9', desc:'Guess which box', color:'var(--c-amber)'},
  {id:8, title:'Dice Sums', topic:'Horse Race', desc:'Guess the winner', color:'var(--c-teal)'},
  {id:9, title:'Central Limit Theorem', topic:'Section 12', desc:'Spread your bet', color:'var(--c-purple)'},
  {id:10, title:'Reverse the Race', topic:'Inference', desc:'Guess the dice + bias!', color:'var(--c-gold)'},
];

// ============================================================================
// ============================  TUTORIAL DATA  ===============================
// ============================================================================
//   HAND-EDIT THIS BLOCK to change tutorial rounds. Save the file and reload.
//
//   Every game has exactly 12 tutorial rounds (one entry per round).
//   Field names are spelled out below — change values freely.
//
//   FIELDS USED:
//     answerDie    the die the player must identify (4, 6, 8 or 10)
//     roll         the single roll shown to the player
//     rolls        array of rolls (used for game 4: three rolls per round)
//     dieOptions   the two dice the player picks between (game 3 only)
//     diceA/diceB  contents of Box A and Box B (game 6)
//     countA       how many of dieA are in the box (out of 8)        (game 6)
//     amber/blue   contents of Amber Box and Blue Box (game 7)
//     chosenBox    'amber' or 'blue' — which box was chosen (game 7)
//     numDice      number of dice rolled together (race games)
//     dieSides     face count of each die (4, 6, 8 or 10)
//     bias         bias preset name ('fair','line','twin','boat','arch','step','edge')
//     diceSides    array of dice rolled together (game 8 horse race)
//     lanesLen     length of each of the 12 lanes (game 8 horse race)
// ============================================================================

const TUT = {

  // ---- GAME 1: Probability ----
  // Player sees a hidden die and guesses which one it is. No roll info.
  game1: {
    answerDie: [6, 8, 4, 10, 6, 4, 8, 10, 4, 6, 10, 8],
  },

  // ---- GAME 2: Likelihood ----
  // One roll is shown each round; player guesses which die produced it.
  game2: {
    roll:      [9, 7, 3, 4, 5, 2, 6, 3, 4, 7, 1, 8],
    answerDie: [10,8, 8, 6, 10,8, 6, 8, 4, 10,4, 10],
  },

  // ---- GAME 3: Likelihood Ratio ----
  // One roll + two candidate dice; player picks which die produced the roll.
  game3: {
    roll:       [3, 3, 5, 4, 9, 2, 2, 4, 6, 7, 1, 1],
    dieOptions: [[8,10],[6,10],[6,8],[4,8],[8,10],[4,6],[4,10],[8,10],[6,10],[6,8],[6,8],[4,8]],
    answerDie:  [10,   6,     6,    4,    10,    6,    10,    10,    6,     8,    6,    4],
  },

  // ---- GAME 4: Independence ----
  // Three rolls per round; player guesses the die.
  game4: {
    rolls:     [[3,8,4],[1,4,6],[4,1,5],[1,3,4],[2,2,3],[3,10,5],[2,4,5],[2,5,6],[4,3,1],[4,6,4],[7,9,2],[3,3,4]],
    answerDie: [8,      8,      6,      4,      4,      10,      6,      10,     4,      8,      10,     6],
  },

  // ---- GAME 6: Bayes ----
  // Box has countA dice of type diceA and (8-countA) of diceB. One roll is shown.
  game6: {
    roll:      [1, 7, 3, 4, 5, 9, 6, 3, 4, 7, 2, 8],
    diceA:     [8, 4, 4, 4, 6, 8, 6, 4, 4, 6, 4, 8],
    diceB:     [10,10,6, 8, 10,10,8, 6, 8, 10,6, 10],
    countA:    [1, 2, 3, 5, 4, 2, 5, 3, 5, 2, 6, 1],
    answerDie: [10,10,6, 4, 10,10,8, 4, 8, 10,4, 10],
  },

  // ---- GAME 7: Marginalization ----
  // Two boxes (Amber, Blue), each holds two dice. Player picks which box held the rolled die.
  game7: {
    roll:      [3, 7, 9, 2, 5, 6, 4, 8, 1, 3, 10, 5],
    chosenBox: ['blue','amber','amber','blue','amber','blue','amber','amber','amber','blue','amber','blue'],
    answerDie: [10, 8, 10, 6, 6, 8, 8, 8, 4, 4, 10, 10],
    amber:     [[4,6],[6,8],[8,10],[4,8],[6,10],[4,6],[8,10],[6,8],[4,10],[8,10],[4,10],[6,8]],
    blue:      [[8,10],[4,10],[4,6],[6,10],[4,8],[8,10],[4,6],[4,10],[6,8],[4,6],[6,8],[4,10]],
  },

  // ---- GAME 8: Dice Sums (Horse Race) ----
  // diceSides[] = which dice are rolled together each turn.
  // lanesLen[]  = length of each of 12 lanes (uniform OR triangular peak).
  // Roll sequences are computed at load by a seeded RNG so every user sees the same races.
  game8: [
    {diceSides:[6,6],     lanesLen:[10,10,10,10,10,10,10,10,10,10,10,10]},  // 1: 2d6 uniform
    {diceSides:[4,4,4],   lanesLen:[8, 8, 8, 8, 8, 8, 8, 8, 8, 8, 8, 8]},   // 2: 3d4 uniform
    {diceSides:[6,8],     lanesLen:[4, 5, 6, 7, 8, 9, 10,11,12,11,10,9]},   // 3: d6+d8 triangular, peak=lane 9
    {diceSides:[8,8],     lanesLen:[14,14,14,14,14,14,14,14,14,14,14,14]},  // 4: 2d8 uniform
    {diceSides:[4,6],     lanesLen:[6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6]},   // 5: d4+d6 uniform
    {diceSides:[6,6,6],   lanesLen:[12,12,12,12,12,12,12,12,12,12,12,12]},  // 6: 3d6 uniform
    {diceSides:[4,4,4],   lanesLen:[3, 4, 5, 6, 7, 8, 9, 10,9, 8, 7, 6]},   // 7: 3d4 triangular, peak=lane 8
    {diceSides:[4,8],     lanesLen:[9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9]},   // 8: d4+d8 uniform
    {diceSides:[6,8],     lanesLen:[16,16,16,16,16,16,16,16,16,16,16,16]},  // 9: d6+d8 uniform long
    {diceSides:[4,4],     lanesLen:[4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4]},   // 10: 2d4 uniform short
    {diceSides:[6,6],     lanesLen:[4, 5, 6, 7, 8, 9, 10,9, 8, 7, 6, 5]},   // 11: 2d6 triangular, peak=lane 7
    {diceSides:[4,6,6],   lanesLen:[20,20,20,20,20,20,20,20,20,20,20,20]},  // 12: d4+2d6 uniform longest
  ],

  // ---- GAME 9: Central Limit Theorem (Biased Horse Race) ----
  // Track length is always 24 steps per lane.
  // Roll sequences are computed at load by a seeded RNG so every user sees the same races.
  game9: [
    {numDice:1, dieSides:6,  bias:'fair'},   // 1:  1d6 fair
    {numDice:2, dieSides:6,  bias:'fair'},   // 2:  2d6 fair
    {numDice:1, dieSides:10, bias:'line'},   // 3:  1d10 line (rising)
    {numDice:3, dieSides:4,  bias:'twin'},   // 4:  3d4 twin (extremes)
    {numDice:2, dieSides:8,  bias:'edge'},   // 5:  2d8 edge (heavy high)
    {numDice:1, dieSides:8,  bias:'arch'},   // 6:  1d8 arch

  ],

  // ONE hidden race per game, played over 12 attempts (= 12 rounds).
  // Player must figure out the 3 dice + bias from the lane distribution.
  // The race result is computed analytically as a Gaussian (sum of weighted dice).
  // diceSides = the 3 dice (any mix of 4, 6, 8, 10).
  // bias      = 'fair','line','twin','boat','arch','step','edge'.
  game10: [
    {diceSides:[4,6,10], bias:'boat'},   // tutorial race

// ===== UTILITIES =====
const roll = (sides) => Math.floor(Math.random()*sides)+1;
const pick = (arr) => arr[Math.floor(Math.random()*arr.length)];
const prob = (val,sides) => val<=sides ? 1/sides : 0;
const frac = (val,sides) => val<=sides ? `1/${sides}` : '0';

// Deterministically pre-compute the roll sequence for every Game-8 tutorial round.
// Same seed every load → every user sees the same 12 races.
(function(){
  let seed=20260424;
  const r=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const sRoll=(n)=>Math.floor(r()*n)+1;
  const G8_TRACK_LEN=24;
  TUT.game8.forEach(round=>{
    const positions=Array(12).fill(0);
    const rolls=[];
    let winner=null;
    while(winner==null && rolls.length<800){
      const dice=round.diceSides.map(s=>sRoll(s));
      rolls.push(dice);
      const sum=dice.reduce((a,b)=>a+b,0);
      if(sum>=1 && sum<=12){
        positions[sum-1]++;
        if(positions[sum-1]>=G8_TRACK_LEN) winner=sum;
      }
    }
    round.rolls=rolls;
    round.winner=winner;
  });
})();

// Game-9 tutorial: pre-compute the biased roll sequence per round so every user sees the same races.
(function(){
  let seed=20260524;
  const r=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const TRACK_LEN=24;
  TUT.game9.forEach(round=>{
    const weights=biasForPreset(round.bias, round.dieSides);
    const total=weights.reduce((a,b)=>a+b,0);
    const sRoll=()=>{
      let rr=r()*total, cum=0;
      for(let i=0;i<round.dieSides;i++){cum+=weights[i];if(rr<cum)return i+1;}
      return round.dieSides;
    };
    // Game 9 is now fixed at 12 lanes (matches Game 8). Sums > 12 are dead rolls.
    const N=12;
    const positions=Array(N).fill(0);
    const rolls=[];
    let winner=null;
    // Higher cap to allow biased configs whose mode lies above 12 to still
    // eventually produce a winner (lots of dead rolls).
    while(winner==null && rolls.length<3000){
      const dice=[];for(let i=0;i<round.numDice;i++) dice.push(sRoll());
      rolls.push(dice);
      const sum=dice.reduce((a,b)=>a+b,0);
      if(sum>=1 && sum<=N){
        positions[sum-1]++;
        if(positions[sum-1]>=TRACK_LEN) winner=sum;
      }
    }
    round.rolls=rolls;
    round.winner=winner;
  });
})();

function generateRounds(gameId) {
  const rounds = [];
  if (gameId===1) {
    for(let i=0;i<10;i++){
      const die = S.mode==='tutorial' ? TUT.game1.answerDie[i] : pick([4,6,8,10]);
      rounds.push({die});
    }
  } else if (gameId===2) {
    for(let i=0;i<10;i++){
      if(S.mode==='tutorial'){
        rounds.push({roll:TUT.game2.roll[i], die:TUT.game2.answerDie[i]});
      } else {
        const die=pick([4,6,8,10]); rounds.push({roll:roll(die), die});
      }
    }
  } else if (gameId===8) {
    // Track length is always 24 across all 12 lanes.
    const TRACK_LEN_8=24;
    if(S.mode==='tutorial'){
      for(const t of TUT.game8.slice(0,10)){
        rounds.push({
          trackLen: TRACK_LEN_8,
          lanesLen: Array(12).fill(TRACK_LEN_8),
          diceSides: t.diceSides.slice(),
          rolls: t.rolls.map(d=>d.slice()), // deterministic sequence
        });
      }
    } else {
      for(let i=0;i<10;i++){
        rounds.push({
          trackLen: TRACK_LEN_8,
          lanesLen: Array(12).fill(TRACK_LEN_8),
          diceSides: G8_DICE_COMBOS[Math.floor(Math.random()*G8_DICE_COMBOS.length)],
        });
      }
    }
  } else if (gameId===3) {
    for(let i=0;i<10;i++){
      if(S.mode==='tutorial'){
        rounds.push({roll:TUT.game3.roll[i], pair:TUT.game3.dieOptions[i], die:TUT.game3.answerDie[i]});
      } else {
        const die=pick([4,6,8,10]);
        const r=roll(die);
        const others=[4,6,8,10].filter(d=>d!==die);
        const partner=pick(others);
        const pair=[Math.min(die,partner),Math.max(die,partner)];
        rounds.push({roll:r, pair, die});
      }
    }
  } else if (gameId===4) {
    for(let i=0;i<10;i++){
      if(S.mode==='tutorial'){
        rounds.push({rolls:TUT.game4.rolls[i], die:TUT.game4.answerDie[i]});
      } else {
        const die=pick([4,6,8,10]);
        rounds.push({rolls:[roll(die),roll(die),roll(die)], die});
      }
    }
  } else if (gameId===6) {
    // Each round: pick 2 dice types, random counts summing to 8
    const pool=[4,6,8,10];
    for(let i=0;i<10;i++){
      let dA,dB,cA,cB;
      if(S.mode==='tutorial'){
        dA=TUT.game6.diceA[i];dB=TUT.game6.diceB[i];cA=TUT.game6.countA[i];cB=8-cA;
      } else {
        // pick 2 different dice
        const shuffled=[...pool].sort(()=>Math.random()-.5);
        dA=shuffled[0];dB=shuffled[1];if(dA>dB){const t=dA;dA=dB;dB=t;}
        cA=1+Math.floor(Math.random()*7);cB=8-cA;
      }
      const bag=[];
      for(let j=0;j<cA;j++)bag.push(dA);
      for(let j=0;j<cB;j++)bag.push(dB);
      const die=S.mode==='tutorial'?TUT.game6.answerDie[i]:pick(bag);
      const r=S.mode==='tutorial'?TUT.game6.roll[i]:roll(die);
      rounds.push({roll:r, die, diceA:dA, diceB:dB, countA:cA, countB:cB});
    }
  } else if (gameId===7) {
    for(let i=0;i<10;i++){
      let amberDice,blueDice,box,die;
      if(S.mode==='tutorial'){
        amberDice=TUT.game7.amber?TUT.game7.amber[i]:[6,8];
        blueDice=TUT.game7.blue?TUT.game7.blue[i]:[4,10];
        box=TUT.game7.chosenBox[i];die=TUT.game7.answerDie[i];
      } else {
        const shuffled=[4,6,8,10].sort(()=>Math.random()-.5);
        amberDice=[shuffled[0],shuffled[1]].sort((a,b)=>a-b);
        blueDice=[shuffled[2],shuffled[3]].sort((a,b)=>a-b);
        box=pick(['amber','blue']);
        die=box==='amber'?pick(amberDice):pick(blueDice);
      }
      rounds.push({roll:S.mode==='tutorial'?TUT.game7.roll[i]:roll(die), box, die, amberDice, blueDice});
    }
  } else if (gameId===5) {
    // Pre-generated 10-round match: pre-rolled streams + rejection-sample so
    // an optimal player would win by ≥1 decisive round. See g5GenerateMatch.
    rounds.push(...g5GenerateMatch());
  } else if (gameId===9) {
    // Track length is always 24. Tutorial: hardwired dice + bias + roll sequence per round.
    const TRACK_LEN=24;
    if(S.mode==='tutorial'){
      // Lanes fixed at 12 (matches Game 8). Tutorial uses uniform-dice combos;
      // the diceSides array is just N copies of the chosen die.
      for(const t of TUT.game9.slice(0,10)){
        const diceSides = Array(t.numDice).fill(t.dieSides);
        rounds.push({
          diceSides,
          maxSum:12, trackLen:TRACK_LEN,
          lanesLen:Array(12).fill(TRACK_LEN),
          bias:t.bias,
          houseLane:g9ModeLane(diceSides, t.bias),
          rolls:t.rolls.map(d=>d.slice()),
        });
      }
    } else {
      const PRESETS=['fair','line','twin','boat','arch','step','edge'];
      for(let i=0;i<10;i++){
        // Random rounds now draw from the full 28-combo set (1–4 mixed dice),
        // matching Games 8 and 10.
        const diceSides=G10_VALID_COMBOS[Math.floor(Math.random()*G10_VALID_COMBOS.length)].slice();
        const bias=PRESETS[Math.floor(Math.random()*PRESETS.length)];
        rounds.push({diceSides, maxSum:12, trackLen:TRACK_LEN, lanesLen:Array(12).fill(TRACK_LEN), bias, houseLane:g9ModeLane(diceSides, bias)});
      }
    }
  } else if (gameId===10) {
    // Reverse the Race: ONE hidden race per game, 12 attempts.
    // The race result is a Gaussian (sum of bias-weighted dice — closed form, no simulation).
    // Player must figure out the dice combo + bias from the lane distribution shown.
    const TRACK_LEN = 24;
    const PRESETS = ['fair','line','twin','boat','arch','step','edge'];
    let actualDiceSides, actualBias;
    if (S.mode === 'tutorial') {
      const t = TUT.game10[0];
      actualDiceSides = t.diceSides.slice();
      actualBias = t.bias;
    } else {
      // Random: pick from the 28 valid combos so the puzzle stays solvable.
      actualDiceSides = G10_VALID_COMBOS[Math.floor(Math.random()*G10_VALID_COMBOS.length)].slice();
      actualBias = pick(PRESETS);
    }
    const actualRace = g10GaussianRace(actualDiceSides, actualBias, TRACK_LEN);
    const animals = g9SampleAnimals(12);
    // 10 rounds, all attempts at the same race.
    for (let i = 0; i < 10; i++) {
      rounds.push({
        attemptIdx: i,
        diceSides: actualRace.diceSides.slice(),
        bias: actualRace.bias,
        maxSum: actualRace.maxSum,
        trackLen: actualRace.trackLen,
        actualPositions: actualRace.positions.slice(),
        actualWinner: actualRace.winner,
        animals,
        // Filled on submit:
        guessDice: null, guessBias: null,
        playerPositions: null, playerWinner: null,
        points: null, correct: null,
      });
    }
  }
  return rounds;
}

// ===== NAVIGATION =====
function showPage(id){
  document.querySelectorAll('.page,.game-screen').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}


function goToTitle(){showPage('title-page')}

function goToGameList(){
  S.roomCode=document.getElementById('room-code').value.trim();
  S.playerNickname=getOrCreateNickname();
  logEvent({event:'session_start'});
  renderGameCards();
  showPage('game-list');
}

function renderGameCards(){
  const c=document.getElementById('game-cards');
  c.innerHTML='';
  GAMES.forEach(g=>{
    const done=S.completed[g.id-1];
    const card=document.createElement('div');
    card.className='game-card';
    card.onclick=()=>startGame(g.id);
    card.innerHTML=`<div class="num" style="background:${g.color}">${g.id}</div>
      <div class="info"><h3>${g.title}</h3><p>${g.desc}</p></div>
      ${done?`<div class="score-badge done">✓</div>`:''}`;
    c.appendChild(card);
  });
}

// ===== GAME ENGINE =====
function startGame(id){
  S.currentGame=id;
  S.currentRound=0;
  S.phase='guess';
  S.mode=S.gameTutorial[id]?'tutorial':'random';
  S.rounds=generateRounds(id);
  if(id===5||id===8||id===10){S.scores[id-1]=0;}
  if(id===9){S.scores[8]=0; S.houseScores[8]=0;}
  document.getElementById('game-title').textContent=GAMES[id-1].title;
  updateTutToggle();
  updateHcapToggle();
  showPage('game-screen');
  renderRound();
}

function toggleHandicap(){
  if(S.currentGame===8){
    if(S.g8 && S.g8.bet!=null) return;
    S.g8Handicap=!S.g8Handicap;
  } else if(S.currentGame===9){
    // Don't allow toggling once the race has been started.
    if(S.g9 && S.g9.locked) return;
    S.g9Handicap=!S.g9Handicap;
  } else return;
  updateHcapToggle();
  renderRound();
}

function updateHcapToggle(){
  // The toggle is rendered inline by renderGame8/renderGame9.
  const toggle=document.getElementById('hcap-toggle');
  const sw=document.getElementById('hcap-switch');
  if(!toggle||!sw) return;
  let on=false, disabled=false;
  if(S.currentGame===8){
    on=!!S.g8Handicap;
    disabled=!!(S.g8 && S.g8.bet!=null);
  } else if(S.currentGame===9){
    on=!!S.g9Handicap;
    disabled=!!(S.g9 && S.g9.locked);
  }
  sw.classList.toggle('on', on);
  toggle.classList.toggle('disabled', disabled);
}

function toggleTutorial(){
  const id=S.currentGame;if(!id)return;
  S.gameTutorial[id]=!S.gameTutorial[id];
  S.mode=S.gameTutorial[id]?'tutorial':'random';
  updateTutToggle();
  // Restart game with new mode
  S.currentRound=0;S.scores[id-1]=0;
  if(id===9) S.houseScores[8]=0;
  S.rounds=generateRounds(id);
  renderRound();
}

function updateTutToggle(){
  const id=S.currentGame;if(!id)return;
  const sw=document.getElementById('tut-switch');
  const lb=document.getElementById('tut-label');
  if(sw)sw.classList.toggle('on',S.gameTutorial[id]);
  if(lb)lb.textContent='Tutorial';
}

function exitGame(){
  S.currentGame=null;
  renderGameCards();
  showPage('game-list');
}

// What dice to show inside the box for each game
function boxDiceForGame(id){
  if(id===6){
    const rd=S.rounds[S.currentRound];
    if(!rd)return [{cls:'d8',label:'8'}];
    const d=[];
    for(let i=0;i<rd.countA;i++)d.push({cls:'d'+rd.diceA,label:''+rd.diceA});
    for(let i=0;i<rd.countB;i++)d.push({cls:'d'+rd.diceB,label:''+rd.diceB});
    return d;
  }
  if(id===7) return null; // special: two boxes
  if(id===3){
    // Likelihood-ratio game: only the two candidate dice for the round.
    const rd=S.rounds[S.currentRound];
    const pair=rd&&rd.pair?rd.pair:[4,8];
    return pair.map(d=>({cls:'d'+d,label:''+d}));
  }
  return [{cls:'d4',label:'4'},{cls:'d6',label:'6'},{cls:'d8',label:'8'},{cls:'d10',label:'10'}];
}

// One-paragraph premise + aim for each game with a blurb. Rendered into the
// instructions popup via openInstructions(gameId); the under-box helper
// gameDescHTML now emits only the trigger button.
const GAME_DESCRIPTIONS = {
  1: `The box holds <b>four dice</b>. A dice is selected from the box, chosen at random. You see <b>nothing</b>: no rolls, no clues. Every dice is equally likely, so the guess is right just <b>one time in four</b>.`,
  2: `The box holds <b>four dice</b>. A dice is selected from the box, chosen at random. You see <b>one roll</b> from the chosen dice. Some dice are more likely to produce that roll than others — use the <b>likelihood</b> to guess which dice was chosen.`,
  3: `Two candidate dice, <b>one roll</b>. Pick the dice the data favours <i>and</i> rate how strongly: when the less-likely dice makes the roll <b>impossible</b>, you're <b>certain</b>; when both dice make it almost equally likely, you have <b>low confidence</b>. You should guess correctly more often when the <b>likelihood ratio</b> is <b>high</b>.`,
  4: `The box holds <b>four dice</b>. A dice is selected from the box, chosen at random. You see <b>three independent rolls</b> from the chosen dice. Independent rolls <b>multiply</b> their likelihoods — combine all three to guess which dice was chosen.`,
  5: `Is the dice <b>Fair</b> or <b>biased</b>? The <b>House</b> tracks the <b>likelihood ratio</b> <b>L(A) / L(B)</b>; you track the <b>likelihood gain</b> <b>log L(A) − log L(B)</b>. They carry the same information — the gain is just the log of the ratio — but the gain grows by <b>addition</b> instead of <b>multiplication</b>, so it stays on a friendly numeric scale much longer.<br><br>Each roll costs <b>1 token per tracked value</b>, plus <b>+1</b> every time that value crosses a new order of magnitude. Both sides track <b>2</b> values, so the minimum is <b>2 tokens</b> per roll. You each start with <b>14 tokens</b>; logs grow slowly, so the player's precision wall is much further off. <b>Commit to a guess whenever you're ready</b> — every unused coin (yours <i>and</i> the house's) goes straight into the prize pot.`,
  6: `The box holds <b>eight dice</b>: some of one type, some of another. A dice is selected from the box, chosen at random. You see <b>one roll</b> from the chosen dice. Combine the <b>prior</b> (how many of each type are in the box) with the <b>likelihood</b> (which type fits the roll) to guess which dice was chosen — that's <b>Bayes' theorem</b>.`,
  7: `Two boxes, <b>Amber</b> and <b>Blue</b>, each hold <b>two dice</b>. A box is chosen at random, then a dice is selected from that box, chosen at random. You see <b>one roll</b> from the chosen dice. <b>Marginalize / sum over the unknowns / integrate out the nuisance variable</b> — the two possible dice in each box — to get the <b>marginal probability / P(roll | box)</b>, then pick the more likely box.`,
  8: `A handful of dice is rolled and summed; the animal in the lane equal to that sum advances one step. The first lane to reach the finish line wins. Before the race you <b>pick the lane you think will win</b> — score <b>3</b> for an exact match, <b>2</b> within one lane, <b>1</b> within two. The shape of the sum's <b>probability mass function / PMF / distribution</b> — peaked near its <b>mean / average / expected value / μ</b> and broadened by its <b>variance / spread / σ²</b> — gives you a better guess than picking the middle lane by reflex.`,
  9: `Same race as <b>Dice Sums</b>, but every dice shares the <b>same bias</b> — picked from <b>Fair</b>, <b>Line</b>, <b>Twin</b>, <b>Boat</b>, <b>Arch</b>, <b>Step</b> or <b>Edge</b>. Bias <b>shifts the mean / average / expected value / μ</b> and <b>reshapes the variance / spread / σ²</b> of the dice sum, so the winning lane is no longer where you'd expect.<br><br>This round you bet against the <b>House</b>. The House always places all <b>12 tokens</b> on the <b>modal lane</b> (the most-probable sum given the bias) — winning <b>12</b> if that lane wins, <b>0</b> otherwise. You have <b>12 tokens</b> to <b>spread your bet</b> across <b>1, 2, 3, 4, 6 or 12 lanes</b> — <b>12/n tokens per lane</b>. If a covered lane wins, you score the <b>12/n tokens</b> on it; otherwise <b>0</b>. <b>Narrow bets pay more, rarely</b>; <b>wide bets pay less, often</b>. The trade-off isn't symmetric: on a <b>low-variance</b> bias (mass piled on one lane) the mode bet has the highest expected score; on a <b>high-variance</b> bias (mass spread across many lanes) every spread has nearly the same expected score, so a wider bet can <b>win more sessions</b> over the 10-round game by avoiding the streaks of zeroes the narrow bet suffers. Match the spread to the variance you expect.`,
  10: `You see the <b>finished distribution</b> of a hidden race: animals frozen at the positions their lane reached when the winner crossed. By the <b>Central Limit Theorem / CLT</b>, the sum's <b>PMF</b> is approximately <b>Gaussian / Normal / bell-curve</b>, so the shape is captured by its <b>mean / μ</b> and <b>variance / σ²</b>. <b>Reverse the race</b> — figure out which dice combination (1–4 dice from {d4, d6, d8, d10}) and which bias produced that mean and variance. You get <b>10 attempts</b> at the <i>same</i> race; each prediction is dropped onto the track as coloured dots. The score is the <b>Euclidean distance / L2 distance / root-sum-squared</b> between your predicted lane heights and the actual ones — <b>lower is better</b>.`,
};

function openInstructions(gameId){
  const modal=document.getElementById('instructions-modal');
  const body=document.getElementById('instructions-modal-body');
  if(!modal||!body) return;
  body.innerHTML=GAME_DESCRIPTIONS[gameId]||'';
  modal.style.display='flex';
}
function closeInstructions(evt){
  // Backdrop onclick: only close if the click target IS the backdrop itself.
  // Clicks inside the card bubble up here too (no stopPropagation on the card)
  // — filtering by target.id keeps the popup open when the card is clicked.
  if(evt && evt.target && evt.target.id!=='instructions-modal') return;
  const modal=document.getElementById('instructions-modal');
  if(modal) modal.style.display='none';
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    const m=document.getElementById('instructions-modal');
    if(m && m.style.display!=='none') m.style.display='none';
  }
});

    // a direct child of .box-scene (same as other games), just positioned left

      <div class="box-lid g7-lid-r" id="box-lid-b" style="top:2.4rem;bottom:auto;left:auto;right:0.25rem;width:7.5rem;height:var(--sz-3);background:linear-gradient(145deg,${tintB},${darkB});border-color:${darkB}"></div>
      <div class="box-body box-shaking" style="top:3.4rem;bottom:auto;left:auto;right:0.375rem;width:7.25rem;height:5.625rem;background:linear-gradient(145deg,${tintB},${darkB});border-color:${darkB}">${dice(bd,'blue')}</div>

const DIE_COLORS = {4:'var(--c-die-1)',6:'var(--c-die-2)',8:'var(--c-die-3)',10:'var(--c-die-4)'};
const DIE_CLIPS = {
  4:'polygon(50% 0%,100% 50%,50% 100%,0% 50%)',
  6:'polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)',
  8:'polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%)',
  10:'polygon(50% 0%,79% 10%,100% 38%,97% 69%,79% 95%,50% 100%,21% 95%,3% 69%,0% 38%,21% 10%)'
};

function revealDieInHand(dieValue, boxHint){
  const hand=document.getElementById('box-hand');
  const qm=document.getElementById('qm-circle');
  if(!hand)return;

  // Remove the revealed die from the box-dice strip (so the hand "took" it).
  const sides=[4,6,8,10].includes(dieValue)?dieValue:10;
  const scope=boxHint
    ? document.querySelector(`.box-dice[data-box="${boxHint}"]`)
    : document.querySelector('.box-dice');
  if(scope){
    const match=scope.querySelector(`.box-die.d${sides}:not(.removed)`);
    if(match){
      match.classList.add('removed');
      match.style.transition='opacity .3s, transform .3s';
      match.style.opacity='0';
      match.style.transform='scale(.5)';
    }
  }

  // Open palm (don't move — stay in same position as pulling)
  const shape=hand.querySelector('.hand-shape');
  if(shape) shape.textContent='🤚';

  // Change circle colour and content — keep same size
  const color=DIE_COLORS[sides]||'#888';
  if(qm){
    // Game 1 starts with .plain (transparent bg, black "?") — once a real die
    // is revealed, drop .plain so the number renders white like other dice.
    qm.classList.remove('plain');
    qm.style.background=color;
    qm.style.clipPath=DIE_CLIPS[sides]||'';
    qm.style.borderRadius=DIE_CLIPS[sides]?'0':'50%';
    qm.style.transition='clip-path .3s, background .3s';
    // Hide reel, show number
    const reelDiv=qm.querySelector('.qm-reel');
    const textSpan=qm.querySelector('.qm-text');
    if(reelDiv) reelDiv.style.display='none';
    if(textSpan){textSpan.style.display='';textSpan.textContent=dieValue;}
    else qm.innerHTML=`<span class="qm-text" style="font-size:var(--sz-4);font-weight:var(--fw-bold)">${dieValue}</span>`;
  }

}

function startBoxAnimation(){
  const lid=document.getElementById('box-lid');
  const hand=document.getElementById('box-hand');
  const held=document.getElementById('box-held');
  if(!hand)return;
  // Sequence delays + lid rotation duration are scaled by diceSpeedFactor()
  // so "Fast" halves both the lid swing and the whole box sequence.
  const f=diceSpeedFactor();
  const lidDur=(0.4*f)+'s';
  // Game 7 lids
  const lidA=document.getElementById('box-lid-a');
  const lidB=document.getElementById('box-lid-b');
  if(lid)  lid.style.transitionDuration=lidDur;
  if(lidA) lidA.style.transitionDuration=lidDur;
  if(lidB) lidB.style.transitionDuration=lidDur;
  if(lid)  setTimeout(()=>{lid.classList.add('open')},600*f);
  if(lidA) setTimeout(()=>{lidA.classList.add('open')},600*f);
  if(lidB) setTimeout(()=>{lidB.classList.add('open')},700*f);
  setTimeout(()=>{hand.classList.add('reaching')},800*f);
  setTimeout(()=>{
    hand.classList.remove('reaching');hand.classList.add('pulling');
    const shape=hand.querySelector('.hand-shape');
    if(shape) shape.textContent='✊';
  },1300*f);
  setTimeout(()=>{held.classList.add('shown')},1500*f);
}

// Zone accessors
const Z = {
  get top(){return document.getElementById('zone-top')},
  get text(){return document.getElementById('zone-text')},
  get buttons(){return document.getElementById('zone-buttons')},
  get next(){return document.getElementById('zone-next')},
  get table(){return document.getElementById('zone-table')},
  get nextBtn(){return document.getElementById('next-round-btn')},
};

function disableNextBtn(){
  const b=Z.nextBtn;if(b){b.disabled=true;b.textContent='Next Round';b.style.background='';b.style.opacity='';}
  const ind=document.getElementById('result-indicator');
  if(ind){ind.className='result-indicator';ind.textContent='';}
}
function nextButtonClick(){S.currentRound++;renderRound();}
function enableNextBtn(){
  const b=Z.nextBtn;if(!b)return;
  const isLast=S.currentRound>=S.rounds.length-1;
  const rd=S.rounds[S.currentRound];
  const ind=document.getElementById('result-indicator');
  if(ind){
    ind.className='result-indicator';
    // Games 8, 9 and 10 use graded scoring (head-to-head / points / distance),
    // not a binary right/wrong — suppress the ✓/✗ badge there to avoid mis-signalling.
    if(S.currentGame===8 || S.currentGame===9 || S.currentGame===10){ind.textContent='';}
    else if(rd && rd.correct===true){ind.classList.add('correct');ind.textContent='✓';}
    else if(rd && rd.correct===false){ind.classList.add('wrong');ind.textContent='✗';}
    else {ind.textContent='';}
  }
  if(isLast){
    S.completed[S.currentGame-1]=true;
    b.disabled=true;
    b.textContent='Game Over';
    b.style.background='#000';
    b.style.opacity='1';
  } else {
    b.disabled=false;
    b.textContent='Next Round';
    b.style.background='';
    b.style.opacity='';
  }
  const gid=S.currentGame;
  logEvent({
    event:'round',
    game:gid,
    round:S.currentRound+1,
    correct:rd?(rd.correct===true):null,
    score:S.scores[gid-1],
    is_last:isLast
  });
}

function renderRound(){
  const id=S.currentGame;
  const rc=document.getElementById('round-counter');

  // Reset zones
  Z.next.style.display='';
  Z.table.style.display='';
  Z.text.style.display='';
  Z.buttons.style.display='';
  Z.buttons.style.justifyContent='';
  Z.top.style.justifyContent='';
  Z.top.style.padding='';
  Z.top.style.overflowY='';
  Z.text.style.flexBasis='';
  Z.text.style.alignItems='';
  Z.table.style.flexBasis='';
  // Skip + Race-Start buttons are race-game-only; hide + disable by default,
  // and restore the default Race-Start handler/label (Game 10 may have rebound them).
  const skipBtn=document.getElementById('g8-skip-btn');
  if(skipBtn){ skipBtn.style.display='none'; skipBtn.disabled=true; }
  const g9Btn=document.getElementById('g9-start-btn');
  if(g9Btn){ g9Btn.style.display='none'; g9Btn.disabled=true; g9Btn.textContent='Race Start'; g9Btn.onclick=g9Start; }
  disableNextBtn();

  if(id===5){if(rc)rc.textContent=`Round ${S.currentRound+1}/10`;renderGame5();return;}
  if(id===9){if(rc)rc.textContent=g9RoundCounterText();renderGame9();return;}
  if(id===10){if(rc)rc.textContent=`Round ${S.currentRound+1}/10`;renderGame10();return;}

  const totalRounds=10;
  if(rc)rc.textContent=`Round ${S.currentRound+1}/${totalRounds}`;

  S.phase='guess';
  const rd=S.rounds[S.currentRound];

  if(id===1) renderGame1(rd);
  else if(id===2) renderGame2(rd);
  else if(id===3) renderGame3(rd);
  else if(id===4) renderGame4(rd);
  else if(id===6) renderGame6(rd);
  else if(id===7) renderGame7(rd);
  else if(id===8) renderGame8(rd);
}

// ===== GAMES 1, 2, 4, 6: shared "guess the dice" template =====
// All four games share the same shape — box graphic, "Which dice?" prompt,
// row of die-value buttons, optional reel(s) that gate the guess area until
// they finish spinning, and an identical reveal sequence. The per-game
// renderGameN/guessGameN entry points below just call these helpers with
// game-specific options.
function renderDiceGuessGame(gameId, rd, options, reels){
  const buttonStyle=gameId===6?' style="font-size:var(--sz-4)"':'';
  const gridExtra=gameId===6?' style="grid-template-columns:1fr 1fr;max-width:25rem"':'';
  // Games with a reel reveal their guess buttons only after spin completes —
  // .hidden-guess keeps them invisible/unclickable until then.
  const hiddenCls=reels>0?' hidden-guess':'';
  Z.top.innerHTML=getBoxHTML(gameId)+gameDescHTML(gameId)+`<div style="font-size:var(--sz-4);text-align:center;margin-top:var(--sz-1)">Which dice?</div>`;
  Z.text.innerHTML='';
  Z.text.style.display='none';
  Z.buttons.innerHTML=`<div class="guess-grid${hiddenCls}" id="guess-area"${gridExtra}>
    ${options.map(d=>`<button class="guess-btn" data-die="${d}" onclick="guessGame${gameId}(${d})"${buttonStyle}>${d}</button>`).join('')}
  </div>`;
  if(gameId===4){
    // Replace the single ? circle with three smaller circles so all three rolls
    // have their own reel target.
    const held=document.getElementById('box-held');
    if(held) held.innerHTML=`<div style="display:flex;gap:var(--sz-1)">
      ${[0,1,2].map(i=>`<div class="question-mark" style="width:2.625rem;height:2.625rem;font-size:var(--sz-3)"><span class="qm-text">?</span><div class="qm-reel" style="display:none"><div class="reel-strip" id="reel${i}"></div></div></div>`).join('')}
    </div>`;
  }
  renderStatsTable(Z.table,gameId);
  startBoxAnimation();
  if(reels===1){
    spinReel('reel0',rd.roll,()=>{
      rd.rollShown=true;
      renderStatsTable(Z.table,gameId);
      const ga=document.getElementById('guess-area');
      if(ga){ga.style.opacity='1';ga.style.pointerEvents='auto';}
    },1800);
  } else if(reels===3){
    rd.rollsShown=[false,false,false];
    let done=0;
    rd.rolls.forEach((v,i)=>spinReel('reel'+i,v,()=>{
      rd.rollsShown[i]=true;
      renderStatsTable(Z.table,gameId);
      done++;
      if(done===3){
        const ga=document.getElementById('guess-area');
        if(ga){ga.style.opacity='1';ga.style.pointerEvents='auto';}
      }
    },1800+i*200));
  }
}

function guessDieGame(gameId,guess){
  if(S.phase!=='guess')return;
  S.phase='reveal';
  const rd=S.rounds[S.currentRound];
  const correct=guess===rd.die;
  if(correct) S.scores[gameId-1]++;
  rd.guess=guess; rd.correct=correct;
  document.querySelectorAll('.guess-btn').forEach(b=>{
    b.disabled=true;
    if(+b.dataset.die===guess) b.classList.add('selected');
  });
  revealDieInHand(rd.die);
  Z.text.innerHTML='';
  Z.text.style.display='none';
  renderStatsTable(Z.table,gameId);
  enableNextBtn();
}

function renderGame1(rd){ renderDiceGuessGame(1, rd, [4,6,8,10], 0); }
function renderGame2(rd){ renderDiceGuessGame(2, rd, [4,6,8,10], 1); }
function guessGame1(g){ guessDieGame(1, g); }
function guessGame2(g){ guessDieGame(2, g); }

let g3Die=null;
function pickGame3Die(d){g3Die=d;document.querySelectorAll('#pick-area .guess-btn').forEach(b=>{b.classList.toggle('selected',+b.dataset.die===d)});checkG3Ready()}
function pickGame3Conf(c){S.game3ConfPick=c;document.querySelectorAll('.g3-conf-btn').forEach(b=>{b.classList.toggle('selected',b.dataset.conf===c)});checkG3Ready()}
function checkG3Ready(){if(g3Die&&S.game3ConfPick)submitGame3()}

function submitGame3(){
  if(S.phase!=='guess')return;
  S.phase='reveal';
  const rd=S.rounds[S.currentRound];
  const [a,b]=rd.pair;
  const pa=prob(rd.roll,a), pb=prob(rd.roll,b);
  const ratio=(pa===0||pb===0)?Infinity:Math.max(pa,pb)/Math.min(pa,pb);
  const correctConf=ratio>3||ratio===Infinity?'certain':ratio>1.5?'medium-high':'low';
  const dieCorrect=g3Die===rd.die;
  if(dieCorrect)S.scores[2]++;
  rd.guess=g3Die;rd.conf=S.game3ConfPick;rd.correct=dieCorrect;rd.ratio=ratio;rd.correctConf=correctConf;

  // Disable all picker buttons in place (no layout shift — matches Game 1's pattern).
  document.querySelectorAll('#pick-area .guess-btn').forEach(b=>{b.disabled=true;if(+b.dataset.die===g3Die)b.classList.add('selected')});
  document.querySelectorAll('#pick-area .g3-conf-btn').forEach(b=>{b.disabled=true;if(b.dataset.conf===S.game3ConfPick)b.classList.add('selected')});
  revealDieInHand(rd.die);
  renderStatsTable(Z.table,3);
  enableNextBtn();
  g3Die=null;S.game3ConfPick=null;
}
